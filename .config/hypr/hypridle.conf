general {
        lock_cmd = noctalia msg session lock          # Bloqueo con la pantalla de Noctalia
        before_sleep_cmd = noctalia msg session lock  # Bloquear antes de que la laptop se duerma
        after_sleep_cmd = hyprctl dispatch dpms on    # Encender pantalla al despertar
    }
    
    # 1. A los 2 minutos y medio: Bajar el brillo un 50% (aviso de que se va a dormir)
    listener {
        timeout = 150
        on-timeout = brightnessctl -s set 20%
        on-resume = brightnessctl -r
    }

    # 2. A los 3 minutos: APAGAR LA PANTALLA OLED (Píxeles a negro total = 0 desgaste)
    listener {
        timeout = 180
        on-timeout = hyprctl dispatch dpms off
        on-resume = hyprctl dispatch dpms on
    }

    # 3. A los 5 minutos: Bloquear la sesión por seguridad
    listener {
        timeout = 300
        on-timeout = noctalia msg session lock
    }

    # 4. A los 15 minutos: Suspender la notebook para no gastar batería
    listener {
        timeout = 900
        on-timeout = systemctl suspend
    }
